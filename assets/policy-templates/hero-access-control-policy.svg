<svg viewBox="0 0 640 500" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Access control illustration">
  <defs>
    <linearGradient id="ac-p" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#A78BFA"/><stop offset="1" stop-color="#6D28D9"/></linearGradient>
    <linearGradient id="ac-t" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22C1B6"/><stop offset="1" stop-color="#0F766E"/></linearGradient>
    <linearGradient id="ac-a" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FBBF24"/><stop offset="1" stop-color="#F59E0B"/></linearGradient>
    <filter id="ac-s" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#6D28D9" flood-opacity="0.20"/></filter>
  </defs>
  <circle cx="150" cy="128" r="92" fill="#EDE9FE"/><circle cx="522" cy="378" r="106" fill="#E0F7F6"/>
  <path d="M486 84 l10 22 22 10 -22 10 -10 22 -10-22 -22-10 22-10z" fill="url(#ac-a)" opacity="0.9"/>
  <circle cx="112" cy="356" r="10" fill="#22C1B6" opacity="0.5"/><circle cx="556" cy="150" r="7" fill="#6D28D9"/>

  <!-- security gate / turnstile door -->
  <g filter="url(#ac-s)" transform="translate(150 150)">
    <rect x="0" y="0" width="140" height="210" rx="14" fill="#fff"/>
    <rect x="0" y="0" width="140" height="30" rx="14" fill="url(#ac-p)"/>
    <!-- keycard reader -->
    <rect x="98" y="96" width="26" height="40" rx="6" fill="#EDE9FE"/><circle cx="111" cy="108" r="5" fill="#22C1B6"/>
    <!-- door split -->
    <rect x="20" y="46" width="52" height="150" rx="6" fill="#F3F4F6"/>
    <rect x="78" y="46" width="42" height="150" rx="6" fill="#F3F4F6"/>
  </g>
  <!-- keycard -->
  <g filter="url(#ac-s)" transform="translate(120 300) rotate(-12)">
    <rect x="0" y="0" width="90" height="58" rx="10" fill="url(#ac-t)"/>
    <circle cx="22" cy="24" r="9" fill="#fff" opacity="0.9"/><rect x="38" y="18" width="40" height="6" rx="3" fill="#fff" opacity="0.7"/><rect x="38" y="32" width="30" height="6" rx="3" fill="#fff" opacity="0.5"/>
  </g>
  <!-- permission levels (user badges w/ locks) -->
  <g filter="url(#ac-s)" transform="translate(360 170)">
    <rect x="0" y="0" width="150" height="200" rx="16" fill="#fff"/>
    <g transform="translate(20 24)"><circle cx="16" cy="16" r="14" fill="#DDF3F0"/><rect x="40" y="8" width="70" height="8" rx="4" fill="#E5E7EB"/><rect x="40" y="22" width="46" height="7" rx="3.5" fill="#EEF0FA"/><g transform="translate(96 4)"><rect x="0" y="6" width="18" height="14" rx="3" fill="#22C1B6"/><path d="M4 6v-3a5 5 0 0 1 10 0v3" fill="none" stroke="#22C1B6" stroke-width="2.4"/></g></g>
    <g transform="translate(20 78)"><circle cx="16" cy="16" r="14" fill="#EDE9FE"/><rect x="40" y="8" width="70" height="8" rx="4" fill="#E5E7EB"/><rect x="40" y="22" width="46" height="7" rx="3.5" fill="#EEF0FA"/><g transform="translate(96 4)"><rect x="0" y="6" width="18" height="14" rx="3" fill="#A78BFA"/><path d="M4 6v-3a5 5 0 0 1 10 0v3" fill="none" stroke="#A78BFA" stroke-width="2.4"/></g></g>
    <g transform="translate(20 132)"><circle cx="16" cy="16" r="14" fill="#FEF3C7"/><rect x="40" y="8" width="70" height="8" rx="4" fill="#E5E7EB"/><rect x="40" y="22" width="46" height="7" rx="3.5" fill="#EEF0FA"/><g transform="translate(96 4)"><rect x="0" y="6" width="18" height="14" rx="3" fill="#F59E0B"/><path d="M4 6v-3a5 5 0 0 1 10 0v3" fill="none" stroke="#F59E0B" stroke-width="2.4"/></g></g>
  </g>
  <circle cx="300" cy="118" r="6" fill="#6D28D9" opacity="0.5"/>
</svg>
