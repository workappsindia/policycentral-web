<svg viewBox="0 0 640 500" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Anti-bribery and anti-corruption illustration">
  <defs>
    <linearGradient id="ab-i" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#818CF8"/><stop offset="1" stop-color="#4338CA"/></linearGradient>
    <linearGradient id="ab-a" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FBBF24"/><stop offset="1" stop-color="#F59E0B"/></linearGradient>
    <linearGradient id="ab-r" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FB7185"/><stop offset="1" stop-color="#E11D48"/></linearGradient>
    <filter id="ab-s" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#4338CA" flood-opacity="0.20"/></filter>
  </defs>
  <circle cx="150" cy="128" r="92" fill="#EDE9FE"/><circle cx="522" cy="378" r="106" fill="#FEE2E2"/>
  <path d="M486 84 l10 22 22 10 -22 10 -10 22 -10-22 -22-10 22-10z" fill="url(#ab-a)" opacity="0.9"/>
  <circle cx="112" cy="356" r="10" fill="#22C1B6" opacity="0.5"/><circle cx="556" cy="150" r="7" fill="#E11D48" opacity="0.7"/>

  <!-- offered cash envelope -->
  <g filter="url(#ab-s)" transform="translate(150 216)">
    <rect x="0" y="0" width="150" height="96" rx="12" fill="#fff"/>
    <path d="M0 12 L75 60 L150 12" fill="none" stroke="#C7D2FE" stroke-width="6"/>
    <g transform="translate(52 26)"><circle cx="24" cy="24" r="22" fill="url(#ab-a)"/><text x="24" y="32" font-family="Plus Jakarta Sans,sans-serif" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">&#8377;</text></g>
  </g>

  <!-- refusing hand + no-symbol -->
  <g filter="url(#ab-s)" transform="translate(330 168)">
    <circle cx="90" cy="90" r="86" fill="#fff"/>
    <circle cx="90" cy="90" r="86" fill="none" stroke="url(#ab-r)" stroke-width="14"/>
    <path d="M30 30l120 120" stroke="url(#ab-r)" stroke-width="14" stroke-linecap="round"/>
    <!-- open palm (stop) -->
    <g transform="translate(56 46)" fill="url(#ab-i)">
      <rect x="24" y="20" width="14" height="54" rx="7"/>
      <rect x="42" y="10" width="14" height="64" rx="7"/>
      <rect x="60" y="14" width="14" height="60" rx="7"/>
      <rect x="78" y="24" width="14" height="50" rx="7"/>
      <path d="M18 60c-6-10 2-18 10-12l6 6V74H24a18 18 0 0 1-6-14z"/>
      <rect x="24" y="70" width="70" height="20" rx="10"/>
    </g>
  </g>
  <circle cx="300" cy="120" r="6" fill="#4338CA" opacity="0.5"/>
</svg>
