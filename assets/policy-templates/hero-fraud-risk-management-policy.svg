<svg viewBox="0 0 640 500" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Fraud risk management illustration">
  <defs>
    <linearGradient id="fr-t" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22C1B6"/><stop offset="1" stop-color="#0F766E"/></linearGradient>
    <linearGradient id="fr-a" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FBBF24"/><stop offset="1" stop-color="#F59E0B"/></linearGradient>
    <linearGradient id="fr-r" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FB7185"/><stop offset="1" stop-color="#E11D48"/></linearGradient>
    <filter id="fr-s" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#0F766E" flood-opacity="0.20"/></filter>
  </defs>
  <circle cx="150" cy="128" r="92" fill="#E0F7F6"/><circle cx="522" cy="378" r="106" fill="#FEF3C7"/>
  <path d="M486 84 l10 22 22 10 -22 10 -10 22 -10-22 -22-10 22-10z" fill="url(#fr-a)" opacity="0.9"/>
  <circle cx="112" cy="356" r="10" fill="#7C3AED" opacity="0.4"/><circle cx="556" cy="150" r="7" fill="#E11D48" opacity="0.7"/>

  <!-- transactions doc with a spiking anomaly line -->
  <g filter="url(#fr-s)" transform="translate(150 152)">
    <rect x="0" y="0" width="270" height="204" rx="18" fill="#fff"/>
    <rect x="24" y="26" width="120" height="10" rx="5" fill="#E5E7EB"/>
    <rect x="24" y="46" width="180" height="7" rx="3.5" fill="#EEF1F4"/>
    <!-- mini bar/line chart -->
    <g transform="translate(24 82)">
      <rect x="0" y="60" width="20" height="30" rx="4" fill="#CFF3EF"/>
      <rect x="34" y="44" width="20" height="46" rx="4" fill="#CFF3EF"/>
      <rect x="68" y="52" width="20" height="38" rx="4" fill="#CFF3EF"/>
      <rect x="102" y="10" width="20" height="80" rx="4" fill="url(#fr-r)"/>
      <rect x="136" y="56" width="20" height="34" rx="4" fill="#CFF3EF"/>
      <rect x="170" y="48" width="20" height="42" rx="4" fill="#CFF3EF"/>
      <polyline points="10,66 44,50 78,58 112,16 146,60 180,52" fill="none" stroke="#0F766E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- alert triangle -->
  <g filter="url(#fr-s)" transform="translate(348 154)">
    <path d="M50 4 L96 92 A8 8 0 0 1 89 104 H11 A8 8 0 0 1 4 92 Z" fill="url(#fr-r)"/>
    <path d="M50 36v34" stroke="#fff" stroke-width="8" stroke-linecap="round"/><circle cx="50" cy="86" r="5" fill="#fff"/>
  </g>
  <!-- magnifier -->
  <g filter="url(#fr-s)" transform="translate(380 288)">
    <circle cx="38" cy="38" r="36" fill="#fff"/>
    <circle cx="38" cy="38" r="36" fill="none" stroke="url(#fr-t)" stroke-width="10"/>
    <path d="M66 66l22 22" stroke="url(#fr-t)" stroke-width="10" stroke-linecap="round"/>
  </g>
  <circle cx="300" cy="118" r="6" fill="#0F766E" opacity="0.5"/>
</svg>
