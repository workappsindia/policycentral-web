    <path d="M6 0 L60 0 A10 10 0 0 1 68 4 L120 56 A12 12 0 0 1 120 74 L74 120 A12 12 0 0 1 56 120 L4 68 A10 10 0 0 1 0 60 L0 6 A6 6 0 0 1 6 0z" fill="url(#gf-t)"/>
