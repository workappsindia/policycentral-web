<svg viewBox="0 0 640 500" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Business continuity and disaster recovery illustration">
  <defs>
    <linearGradient id="bc-t" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22C1B6"/><stop offset="1" stop-color="#0F766E"/></linearGradient>
    <linearGradient id="bc-a" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FBBF24"/><stop offset="1" stop-color="#B45309"/></linearGradient>
    <filter id="bc-s" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#0F766E" flood-opacity="0.18"/></filter>
  </defs>
  <circle cx="150" cy="128" r="92" fill="#E0F7F6"/><circle cx="522" cy="378" r="106" fill="#FEF3C7"/>
  <path d="M486 84 l10 22 22 10 -22 10 -10 22 -10-22 -22-10 22-10z" fill="url(#bc-a)" opacity="0.9"/>
  <circle cx="112" cy="356" r="10" fill="#22C1B6" opacity="0.5"/><circle cx="556" cy="150" r="7" fill="#0F766E"/>

  <!-- recovery arrows circling servers -->
  <g stroke="url(#bc-t)" stroke-width="12" fill="none" stroke-linecap="round">
    <path d="M320 100 a138 138 0 1 1 -150 40"/>
  </g>
  <path d="M320 96l6 26-28 -4z" fill="#0F766E"/>

  <!-- server stack (recovered, with check) -->
  <g filter="url(#bc-s)" transform="translate(232 172)">
    <rect x="0" y="0" width="176" height="50" rx="10" fill="#fff"/><circle cx="28" cy="25" r="9" fill="#5EEAD4"/><rect x="50" y="20" width="90" height="9" rx="4.5" fill="#E5E7EB"/>
    <rect x="0" y="62" width="176" height="50" rx="10" fill="#fff"/><circle cx="28" cy="87" r="9" fill="#5EEAD4"/><rect x="50" y="82" width="90" height="9" rx="4.5" fill="#E5E7EB"/>
    <rect x="0" y="124" width="176" height="50" rx="10" fill="#fff"/><circle cx="28" cy="149" r="9" fill="#5EEAD4"/><rect x="50" y="144" width="90" height="9" rx="4.5" fill="#E5E7EB"/>
  </g>

  <!-- backup/restore check badge -->
  <g filter="url(#bc-s)" transform="translate(372 292)">
    <circle cx="34" cy="34" r="34" fill="url(#bc-t)"/>
    <path d="M22 34l8 8 16-18" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
  <circle cx="300" cy="118" r="6" fill="#0F766E" opacity="0.5"/>
</svg>
