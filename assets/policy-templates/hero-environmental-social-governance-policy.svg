    <rect x="0" y="0" width="250" height="196" rx="18" fill="#fff"/>
    <rect x="24" y="24" width="120" height="9" rx="4.5" fill="#E5E7EB"/>
    <!-- rising bars turning green -->
    <g transform="translate(24 60)">
      <rect x="0" y="70" width="24" height="40" rx="5" fill="#CFF3EF"/>
      <rect x="38" y="52" width="24" height="58" rx="5" fill="#A7F3D0"/>
      <rect x="76" y="34" width="24" height="76" rx="5" fill="#6EE7B7"/>
      <rect x="114" y="14" width="24" height="96" rx="5" fill="url(#esg-g)"/>
      <polyline points="12,74 50,56 88,38 126,18" fill="none" stroke="#047857" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- globe with leaf -->
  <g filter="url(#esg-s)" transform="translate(340 200)">
    <circle cx="66" cy="66" r="66" fill="url(#esg-g)"/>
    <ellipse cx="66" cy="66" rx="28" ry="66" fill="none" stroke="#fff" stroke-width="3" opacity="0.5"/>
    <line x1="0" y1="66" x2="132" y2="66" stroke="#fff" stroke-width="3" opacity="0.5"/>
    <path d="M66 66c0-24 18-42 46-44-2 26-20 42-46 44z" fill="#fff" opacity="0.9"/>
