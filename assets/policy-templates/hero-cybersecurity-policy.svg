<svg viewBox="0 0 640 500" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cybersecurity illustration">
  <defs>
    <linearGradient id="cy-p" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#A78BFA"/><stop offset="1" stop-color="#6D28D9"/></linearGradient>
    <linearGradient id="cy-a" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FBBF24"/><stop offset="1" stop-color="#F59E0B"/></linearGradient>
    <linearGradient id="cy-r" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FB7185"/><stop offset="1" stop-color="#E11D48"/></linearGradient>
    <filter id="cy-s" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#6D28D9" flood-opacity="0.20"/></filter>
  </defs>
  <circle cx="150" cy="128" r="92" fill="#EDE9FE"/><circle cx="522" cy="378" r="106" fill="#FEE2E2"/>
  <path d="M486 84 l10 22 22 10 -22 10 -10 22 -10-22 -22-10 22-10z" fill="url(#cy-a)" opacity="0.9"/>
  <circle cx="112" cy="356" r="10" fill="#22C1B6" opacity="0.5"/><circle cx="556" cy="150" r="7" fill="#E11D48" opacity="0.7"/>

  <!-- incoming threats (bug + hook) -->
  <g filter="url(#cy-s)" transform="translate(120 150)">
    <!-- bug -->
    <g transform="translate(0 60)"><ellipse cx="24" cy="24" rx="18" ry="22" fill="url(#cy-r)"/><circle cx="24" cy="14" r="9" fill="#E11D48"/><path d="M6 16l-12-8M6 30h-14M6 44l-12 8M42 16l12-8M42 30h14M42 44l12 8" stroke="#E11D48" stroke-width="4" stroke-linecap="round"/></g>
    <!-- phishing hook -->
    <g transform="translate(30 -10)"><path d="M20 0v52a16 16 0 0 1-32 0" fill="none" stroke="#F59E0B" stroke-width="6" stroke-linecap="round"/><circle cx="20" cy="0" r="6" fill="#F59E0B"/></g>
  </g>

  <!-- big shield deflecting -->
  <g filter="url(#cy-s)" transform="translate(300 148)">
    <path d="M100 6l92 34v70c0 64-41 100-92 118C57 210 16 174 16 110V40z" fill="url(#cy-p)"/>
    <path d="M100 6l92 34v70c0 64-41 100-92 118z" fill="#000" opacity="0.06"/>
    <path d="M62 112l28 28 50-58" stroke="#fff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
  <!-- deflection sparks -->
  <path d="M250 150l18 10M250 200l18-4M250 250l18 12" stroke="#F59E0B" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
  <circle cx="300" cy="118" r="6" fill="#6D28D9" opacity="0.5"/>
</svg>
