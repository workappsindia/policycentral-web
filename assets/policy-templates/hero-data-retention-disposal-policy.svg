<svg viewBox="0 0 640 500" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Data retention and disposal illustration">
  <defs>
    <linearGradient id="dr-p" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#A78BFA"/><stop offset="1" stop-color="#6D28D9"/></linearGradient>
    <linearGradient id="dr-t" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22C1B6"/><stop offset="1" stop-color="#0F766E"/></linearGradient>
    <linearGradient id="dr-a" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FBBF24"/><stop offset="1" stop-color="#F59E0B"/></linearGradient>
    <filter id="dr-s" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#6D28D9" flood-opacity="0.20"/></filter>
  </defs>
  <circle cx="150" cy="128" r="92" fill="#EDE9FE"/><circle cx="522" cy="378" r="106" fill="#E0F7F6"/>
  <path d="M486 84 l10 22 22 10 -22 10 -10 22 -10-22 -22-10 22-10z" fill="url(#dr-a)" opacity="0.9"/>
  <circle cx="112" cy="356" r="10" fill="#22C1B6" opacity="0.5"/><circle cx="556" cy="150" r="7" fill="#6D28D9"/>

  <!-- archive boxes with clock (retention) -->
  <g filter="url(#dr-s)" transform="translate(150 200)">
    <rect x="0" y="30" width="120" height="90" rx="10" fill="#fff"/>
    <rect x="0" y="30" width="120" height="26" rx="8" fill="url(#dr-p)"/>
    <rect x="44" y="38" width="32" height="9" rx="4.5" fill="#fff" opacity="0.85"/>
    <rect x="16" y="72" width="88" height="8" rx="4" fill="#E5E7EB"/><rect x="16" y="90" width="66" height="8" rx="4" fill="#EEF0FA"/>
    <!-- clock badge -->
    <g transform="translate(88 4)"><circle cx="24" cy="24" r="24" fill="url(#dr-t)"/><path d="M24 12v13l9 6" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g>
  </g>

  <!-- shredder / secure disposal -->
  <g filter="url(#dr-s)" transform="translate(360 168)">
    <!-- paper going in -->
    <rect x="24" y="0" width="96" height="60" rx="8" fill="#fff"/><rect x="38" y="16" width="60" height="7" rx="3.5" fill="#E5E7EB"/><rect x="38" y="30" width="46" height="7" rx="3.5" fill="#EEF0FA"/>
    <!-- shredder body -->
    <rect x="6" y="64" width="132" height="34" rx="10" fill="url(#dr-p)"/>
    <rect x="20" y="76" width="104" height="8" rx="4" fill="#2E1065"/>
    <!-- shreds -->
    <g stroke="#C4B5FD" stroke-width="5" stroke-linecap="round"><path d="M30 108v26"/><path d="M50 108v34"/><path d="M70 108v22"/><path d="M90 108v34"/><path d="M110 108v26"/></g>
  </g>
  <circle cx="300" cy="118" r="6" fill="#6D28D9" opacity="0.5"/>
</svg>
