<svg viewBox="0 0 640 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bp-p" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#A78BFA"/><stop offset="1" stop-color="#6D28D9"/></linearGradient>
    <linearGradient id="bp-t" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22C1B6"/><stop offset="1" stop-color="#0F766E"/></linearGradient>
    <linearGradient id="bp-a" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FBBF24"/><stop offset="1" stop-color="#F59E0B"/></linearGradient>
    <filter id="bp-s" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#6D28D9" flood-opacity="0.20"/></filter>
  </defs>
  <circle cx="150" cy="128" r="92" fill="#EDE9FE"/><circle cx="522" cy="380" r="106" fill="#E0F7F6"/>
  <path d="M486 84 l10 22 22 10 -22 10 -10 22 -10-22 -22-10 22-10z" fill="url(#bp-a)" opacity="0.9"/>
  <circle cx="112" cy="352" r="10" fill="#22C1B6" opacity="0.5"/><circle cx="556" cy="150" r="7" fill="#6D28D9"/>

  <!-- login window -->
  <g filter="url(#bp-s)" transform="translate(150 140)">
    <rect x="0" y="0" width="300" height="220" rx="20" fill="#fff"/>
    <path d="M0 20 a20 20 0 0 1 20-20 h260 a20 20 0 0 1 20 20 v18 H0z" fill="url(#bp-p)"/>
    <circle cx="20" cy="19" r="5" fill="#fff"/><circle cx="38" cy="19" r="5" fill="#fff" opacity="0.7"/><circle cx="56" cy="19" r="5" fill="#fff" opacity="0.5"/>
    <!-- username field -->
    <rect x="34" y="64" width="232" height="34" rx="9" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="1.5"/>
    <circle cx="56" cy="81" r="8" fill="#C7C3F0"/>
    <rect x="76" y="77" width="120" height="8" rx="4" fill="#D6D3E8"/>
    <!-- password field with dots + cursor -->
    <rect x="34" y="112" width="232" height="34" rx="9" fill="#fff" stroke="url(#bp-p)" stroke-width="2"/>
    <g fill="#6D28D9"><circle cx="60" cy="129" r="5"/><circle cx="78" cy="129" r="5"/><circle cx="96" cy="129" r="5"/><circle cx="114" cy="129" r="5"/><circle cx="132" cy="129" r="5"/><circle cx="150" cy="129" r="5"/></g>
    <rect x="162" y="120" width="2.5" height="18" rx="1.25" fill="#6D28D9"/>
    <!-- submit -->
    <rect x="34" y="164" width="232" height="34" rx="9" fill="url(#bp-p)"/>
    <rect x="120" y="176" width="60" height="9" rx="4.5" fill="#fff"/>
  </g>

  <!-- key inserted -->
  <g filter="url(#bp-s)" transform="translate(408 268)">
    <circle cx="34" cy="34" r="34" fill="none" stroke="url(#bp-a)" stroke-width="12"/>
    <rect x="58" y="58" width="46" height="16" rx="8" transform="rotate(45 58 58)" fill="url(#bp-a)"/>
    <rect x="86" y="86" width="10" height="14" rx="3" transform="rotate(45 86 86)" fill="url(#bp-a)"/>
  </g>

  <!-- fingerprint / MFA check badge -->
  <g filter="url(#bp-s)" transform="translate(96 300)">
    <circle cx="34" cy="34" r="36" fill="url(#bp-t)"/>
    <path d="M22 40l8 8 16-18" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
  <circle cx="300" cy="112" r="6" fill="#6D28D9" opacity="0.6"/>
</svg>
