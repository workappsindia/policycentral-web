<svg viewBox="0 0 640 500" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Anti-money-laundering illustration">
  <defs>
    <linearGradient id="aml-t" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22C1B6"/><stop offset="1" stop-color="#0F766E"/></linearGradient>
    <linearGradient id="aml-a" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FBBF24"/><stop offset="1" stop-color="#F59E0B"/></linearGradient>
    <linearGradient id="aml-r" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FB7185"/><stop offset="1" stop-color="#E11D48"/></linearGradient>
    <filter id="aml-s" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#0F766E" flood-opacity="0.20"/></filter>
  </defs>
  <circle cx="150" cy="128" r="92" fill="#E0F7F6"/><circle cx="522" cy="378" r="106" fill="#FEF3C7"/>
  <path d="M486 84 l10 22 22 10 -22 10 -10 22 -10-22 -22-10 22-10z" fill="url(#aml-a)" opacity="0.9"/>
  <circle cx="112" cy="356" r="10" fill="#22C1B6" opacity="0.5"/><circle cx="556" cy="150" r="7" fill="#0F766E"/>

  <!-- funnel / filter -->
  <g filter="url(#aml-s)" transform="translate(196 150)">
    <path d="M0 8 h200 l-70 90 v70 a10 10 0 0 1 -14 9 l-32 -16 v-63z" fill="#fff"/>
    <path d="M0 8 h200 l-40 52 h-120z" fill="url(#aml-t)"/>
    <!-- coins entering top -->
    <g transform="translate(40 -34)"><circle cx="0" cy="0" r="16" fill="url(#aml-a)"/><text x="0" y="6" font-family="Plus Jakarta Sans,sans-serif" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">&#8377;</text></g>
    <g transform="translate(96 -46)"><circle cx="0" cy="0" r="14" fill="url(#aml-a)" opacity="0.85"/></g>
    <g transform="translate(150 -30)"><circle cx="0" cy="0" r="13" fill="url(#aml-a)" opacity="0.7"/></g>
    <!-- clean coin out bottom -->
    <g transform="translate(93 150)"><circle cx="0" cy="0" r="15" fill="url(#aml-t)"/><path d="M-6 0l4 4 8-9" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g>
  </g>

  <!-- magnifier catching a flagged note -->
  <g filter="url(#aml-s)" transform="translate(360 264)">
    <rect x="-40" y="-6" width="150" height="92" rx="12" fill="#fff"/>
    <rect x="-24" y="14" width="90" height="9" rx="4.5" fill="#E5E7EB"/>
    <rect x="-24" y="34" width="70" height="9" rx="4.5" fill="#FBD5DC"/>
    <rect x="-24" y="54" width="100" height="9" rx="4.5" fill="#E5E7EB"/>
    <circle cx="88" cy="44" r="30" fill="none" stroke="url(#aml-r)" stroke-width="9"/>
    <path d="M110 66l22 22" stroke="url(#aml-r)" stroke-width="9" stroke-linecap="round"/>
    <path d="M88 32v14" stroke="#E11D48" stroke-width="5" stroke-linecap="round"/><circle cx="88" cy="56" r="3.4" fill="#E11D48"/>
  </g>
  <circle cx="300" cy="118" r="6" fill="#0F766E" opacity="0.5"/>
</svg>
