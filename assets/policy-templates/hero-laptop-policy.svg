<svg viewBox="0 0 640 500" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Laptop policy illustration">
  <defs>
    <linearGradient id="lp-t" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22C1B6"/><stop offset="1" stop-color="#0F766E"/></linearGradient>
    <linearGradient id="lp-a" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FBBF24"/><stop offset="1" stop-color="#F59E0B"/></linearGradient>
    <filter id="lp-s" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#0F766E" flood-opacity="0.18"/></filter>
  </defs>
  <circle cx="150" cy="128" r="92" fill="#E0F7F6"/><circle cx="522" cy="378" r="106" fill="#EDE9FE"/>
  <path d="M486 84 l10 22 22 10 -22 10 -10 22 -10-22 -22-10 22-10z" fill="url(#lp-a)" opacity="0.9"/>
  <circle cx="112" cy="356" r="10" fill="#7C3AED" opacity="0.4"/><circle cx="556" cy="150" r="7" fill="#0F766E"/>

  <!-- laptop -->
  <g filter="url(#lp-s)" transform="translate(168 176)">
    <rect x="20" y="0" width="220" height="146" rx="14" fill="#fff"/>
    <rect x="36" y="16" width="188" height="114" rx="8" fill="#E0F7F6"/>
    <rect x="54" y="34" width="120" height="10" rx="5" fill="#22C1B6"/>
    <rect x="54" y="54" width="152" height="8" rx="4" fill="#A7E8E1"/>
    <rect x="54" y="72" width="90" height="8" rx="4" fill="#A7E8E1"/>
    <!-- base -->
    <path d="M0 146 h260 l14 26 a6 6 0 0 1 -5 9 H-9 a6 6 0 0 1 -5 -9z" fill="url(#lp-t)"/>
    <rect x="108" y="153" width="44" height="7" rx="3.5" fill="#0F766E"/>
  </g>

  <!-- asset tag -->
  <g filter="url(#lp-s)" transform="translate(372 180) rotate(8)">
    <path d="M0 12 A12 12 0 0 1 12 0 L64 0 A10 10 0 0 1 71 3 L120 52 A12 12 0 0 1 120 70 L74 116 A12 12 0 0 1 56 116 L6 66 A12 12 0 0 1 3 59 L0 12z" fill="url(#lp-a)"/>
    <circle cx="26" cy="26" r="10" fill="#fff"/>
    <rect x="40" y="52" width="60" height="8" rx="4" fill="#fff" opacity="0.85"/>
    <rect x="40" y="68" width="44" height="8" rx="4" fill="#fff" opacity="0.6"/>
  </g>
  <!-- protection check -->
  <g filter="url(#lp-s)" transform="translate(360 300)"><circle cx="30" cy="30" r="30" fill="url(#lp-t)"/><path d="M18 30l8 8 16-18" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g>
  <circle cx="300" cy="118" r="6" fill="#0F766E" opacity="0.5"/>
</svg>
