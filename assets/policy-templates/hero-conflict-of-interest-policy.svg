<svg viewBox="0 0 640 500" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Conflict of interest illustration">
  <defs>
    <linearGradient id="coi-i" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#818CF8"/><stop offset="1" stop-color="#4338CA"/></linearGradient>
    <linearGradient id="coi-t" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22C1B6"/><stop offset="1" stop-color="#0F766E"/></linearGradient>
    <linearGradient id="coi-a" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FBBF24"/><stop offset="1" stop-color="#F59E0B"/></linearGradient>
    <filter id="coi-s" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#4338CA" flood-opacity="0.20"/></filter>
  </defs>
  <circle cx="150" cy="128" r="92" fill="#EDE9FE"/><circle cx="522" cy="378" r="106" fill="#E0F7F6"/>
  <path d="M486 84 l10 22 22 10 -22 10 -10 22 -10-22 -22-10 22-10z" fill="url(#coi-a)" opacity="0.9"/>
  <circle cx="112" cy="356" r="10" fill="#22C1B6" opacity="0.5"/><circle cx="556" cy="150" r="7" fill="#4338CA"/>

  <!-- central person torn two ways -->
  <g filter="url(#coi-s)" transform="translate(268 250)">
    <circle cx="52" cy="52" r="52" fill="#fff"/>
    <circle cx="52" cy="42" r="18" fill="url(#coi-i)"/><path d="M20 88a32 30 0 0 1 64 0z" fill="url(#coi-i)"/>
  </g>
  <!-- two competing interests pulling -->
  <g filter="url(#coi-s)" transform="translate(120 214)">
    <rect x="0" y="0" width="96" height="76" rx="12" fill="url(#coi-t)"/>
    <circle cx="26" cy="26" r="12" fill="#fff" opacity="0.9"/><rect x="46" y="20" width="38" height="7" rx="3.5" fill="#fff" opacity="0.7"/><rect x="18" y="50" width="60" height="7" rx="3.5" fill="#fff" opacity="0.55"/>
  </g>
  <g filter="url(#coi-s)" transform="translate(424 214)">
    <rect x="0" y="0" width="96" height="76" rx="12" fill="url(#coi-a)"/>
    <circle cx="26" cy="26" r="12" fill="#fff" opacity="0.9"/><rect x="46" y="20" width="38" height="7" rx="3.5" fill="#fff" opacity="0.7"/><rect x="18" y="50" width="60" height="7" rx="3.5" fill="#fff" opacity="0.55"/>
  </g>
  <!-- tension arrows -->
  <path d="M244 300 l-30 -8" stroke="#0F766E" stroke-width="6" stroke-linecap="round"/><path d="M220 284l-8 8 12 4" stroke="#0F766E" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M396 300 l30 -8" stroke="#B45309" stroke-width="6" stroke-linecap="round"/><path d="M420 284l8 8-12 4" stroke="#B45309" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <circle cx="300" cy="120" r="6" fill="#4338CA" opacity="0.5"/>
</svg>
