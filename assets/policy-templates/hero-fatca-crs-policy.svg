<svg viewBox="0 0 640 500" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="FATCA and CRS illustration">
  <defs>
    <linearGradient id="ft-a" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FBBF24"/><stop offset="1" stop-color="#B45309"/></linearGradient>
    <linearGradient id="ft-t" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22C1B6"/><stop offset="1" stop-color="#0F766E"/></linearGradient>
    <linearGradient id="ft-b" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#38BDF8"/><stop offset="1" stop-color="#0369A1"/></linearGradient>
    <filter id="ftc-s" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#B45309" flood-opacity="0.16"/></filter>
  </defs>
  <circle cx="150" cy="128" r="92" fill="#FEF3C7"/><circle cx="522" cy="378" r="106" fill="#E0F2FE"/>
  <path d="M486 84 l10 22 22 10 -22 10 -10 22 -10-22 -22-10 22-10z" fill="url(#ft-a)" opacity="0.95"/>
  <circle cx="112" cy="356" r="10" fill="#0369A1" opacity="0.4"/><circle cx="556" cy="150" r="7" fill="#B45309"/>

  <!-- globe (cross-border) -->
  <g filter="url(#ftc-s)" transform="translate(150 190)">
    <circle cx="80" cy="80" r="80" fill="url(#ft-b)"/>
    <ellipse cx="80" cy="80" rx="34" ry="80" fill="none" stroke="#fff" stroke-width="3" opacity="0.55"/>
    <ellipse cx="80" cy="80" rx="80" ry="34" fill="none" stroke="#fff" stroke-width="3" opacity="0.55"/>
    <line x1="0" y1="80" x2="160" y2="80" stroke="#fff" stroke-width="3" opacity="0.55"/>
  </g>

  <!-- exchange arrows -->
  <g stroke="#B45309" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M300 210 q34 -20 66 0"/><path d="M360 200l8 10-12 6" stroke-linejoin="round"/>
    <path d="M366 262 q-34 20 -66 0"/><path d="M306 272l-8 -10 12 -6" stroke-linejoin="round"/>
  </g>

  <!-- reportable account doc -->
  <g filter="url(#ftc-s)" transform="translate(372 170)">
    <rect x="0" y="0" width="150" height="190" rx="16" fill="#fff"/>
    <rect x="22" y="24" width="70" height="10" rx="5" fill="#FDE68A"/>
    <g fill="#E5E7EB"><rect x="22" y="52" width="106" height="8" rx="4"/><rect x="22" y="70" width="86" height="8" rx="4"/><rect x="22" y="88" width="100" height="8" rx="4"/></g>
    <!-- self-cert check -->
    <g transform="translate(96 120)"><circle cx="24" cy="24" r="24" fill="url(#ft-t)"/><path d="M14 24l7 7 14-15" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g>
  </g>
  <circle cx="300" cy="118" r="6" fill="#B45309" opacity="0.5"/>
</svg>
