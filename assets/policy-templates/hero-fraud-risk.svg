<svg viewBox="0 0 640 500" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Financial crime prevention illustration">
  <defs>
    <linearGradient id="fc-t" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22C1B6"/><stop offset="1" stop-color="#0F766E"/></linearGradient>
    <linearGradient id="fc-a" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FBBF24"/><stop offset="1" stop-color="#F59E0B"/></linearGradient>
    <linearGradient id="fc-r" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FB7185"/><stop offset="1" stop-color="#E11D48"/></linearGradient>
    <filter id="fc-s" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#0F766E" flood-opacity="0.20"/></filter>
  </defs>
  <circle cx="150" cy="130" r="94" fill="#E0F7F6"/><circle cx="520" cy="380" r="108" fill="#EDE9FE"/>
  <path d="M486 84 l10 22 22 10 -22 10 -10 22 -10-22 -22-10 22-10z" fill="url(#fc-a)" opacity="0.9"/>
  <circle cx="112" cy="356" r="10" fill="#7C3AED" opacity="0.4"/><circle cx="556" cy="150" r="7" fill="#22C1B6"/>

  <!-- stacked currency notes behind -->
  <g filter="url(#fc-s)" transform="translate(150 250)">
    <rect x="0" y="60" width="180" height="60" rx="10" fill="#CFF3EF"/>
    <rect x="14" y="34" width="180" height="60" rx="10" fill="#A7E8E1"/>
    <rect x="28" y="6" width="180" height="60" rx="10" fill="#fff"/>
    <circle cx="118" cy="36" r="18" fill="none" stroke="#0F766E" stroke-width="3"/>
    <text x="118" y="45" font-family="Plus Jakarta Sans,sans-serif" font-size="22" font-weight="800" fill="#0F766E" text-anchor="middle">&#8377;</text>
    <rect x="52" y="20" width="36" height="7" rx="3.5" fill="#B6E7E0"/>
    <rect x="52" y="46" width="36" height="7" rx="3.5" fill="#B6E7E0"/>
  </g>

  <!-- big protective shield with check -->
  <g filter="url(#fc-s)" transform="translate(330 150)">
    <path d="M92 6l86 32v66c0 60-38 94-86 112C46 198 8 164 8 104V38z" fill="url(#fc-t)"/>
    <path d="M92 6l86 32v66c0 60-38 94-86 112z" fill="#000" opacity="0.06"/>
    <path d="M56 108l26 26 46-52" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- flagged/alert chip -->
  <g filter="url(#fc-s)" transform="translate(430 300)">
    <circle cx="34" cy="34" r="34" fill="url(#fc-r)"/>
    <path d="M34 18v20" stroke="#fff" stroke-width="6" stroke-linecap="round"/><circle cx="34" cy="50" r="4" fill="#fff"/>
  </g>
  <circle cx="300" cy="118" r="6" fill="#0F766E" opacity="0.5"/>
</svg>
