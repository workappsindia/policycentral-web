  <line x1="450" y1="136" x2="598" y2="136" stroke="#179d97" stroke-width="0.4" opacity="0.2"/>

  <!-- Framework rows: label + status dot -->
  <text x="450" y="162" font-family="'Courier New', monospace" font-size="10" fill="#ffffff" opacity="0.9">RBI DL 2025</text>
  <circle cx="596" cy="158" r="4" fill="#179d97" opacity="0.9"/>
  <text x="586" y="162" font-family="'Courier New', monospace" font-size="8" fill="#7ececa" text-anchor="end" opacity="0.7">OK</text>

  <text x="450" y="190" font-family="'Courier New', monospace" font-size="10" fill="#ffffff" opacity="0.8">GDPR Art.5</text>
  <circle cx="596" cy="186" r="4" fill="#e0a43b" opacity="0.9"/>
  <text x="586" y="190" font-family="'Courier New', monospace" font-size="8" fill="#7ececa" text-anchor="end" opacity="0.7">GAP</text>

  <text x="450" y="218" font-family="'Courier New', monospace" font-size="10" fill="#ffffff" opacity="0.7">ISO 27001</text>
  <circle cx="596" cy="214" r="4" fill="#179d97" opacity="0.75"/>
  <text x="586" y="218" font-family="'Courier New', monospace" font-size="8" fill="#7ececa" text-anchor="end" opacity="0.6">OK</text>

  <text x="450" y="246" font-family="'Courier New', monospace" font-size="10" fill="#ffffff" opacity="0.6">SOX 302</text>
  <circle cx="596" cy="242" r="4" fill="#179d97" opacity="0.6"/>
  <text x="586" y="246" font-family="'Courier New', monospace" font-size="8" fill="#7ececa" text-anchor="end" opacity="0.55">OK</text>

  <text x="450" y="274" font-family="'Courier New', monospace" font-size="10" fill="#ffffff" opacity="0.5">HIPAA</text>
  <circle cx="596" cy="270" r="4" fill="#e0a43b" opacity="0.7"/>
  <text x="586" y="274" font-family="'Courier New', monospace" font-size="8" fill="#7ececa" text-anchor="end" opacity="0.5">GAP</text>

  <!-- Brand mark -->
  <text x="614" y="358" font-family="'Courier New', monospace" font-size="9" fill="#179d97" opacity="0.35" text-anchor="end" letter-spacing="2">POLICYCENTRAL.AI</text>
