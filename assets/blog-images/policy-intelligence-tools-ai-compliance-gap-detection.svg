    <circle r="8" fill="none" stroke="#179d97" stroke-width="0.5" opacity="0.15"/>
    <line x1="-26" y1="0" x2="26" y2="0" stroke="#179d97" stroke-width="0.4" opacity="0.2"/>
    <line x1="0" y1="-26" x2="0" y2="26" stroke="#179d97" stroke-width="0.4" opacity="0.2"/>
    <path d="M 0 0 L 22 -14 A 26 26 0 0 1 26 0 Z" fill="#179d97" opacity="0.18"/>
    <circle cx="14" cy="-10" r="2.5" fill="#7ececa"/>
    <circle cx="-11" cy="9" r="2" fill="#179d97" opacity="0.6"/>
    <circle cx="14" cy="-10" r="6" fill="none" stroke="#7ececa" stroke-width="0.6" opacity="0.4"/>
