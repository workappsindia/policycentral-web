  <text x="450" y="208" font-family="'Courier New', monospace" font-size="10" fill="#ffffff" opacity="0.8">Chatbot</text>
  <text x="530" y="208" font-family="'Courier New', monospace" font-size="11" fill="#7ececa" text-anchor="middle" opacity="0.4">&#215;</text>
  <text x="566" y="208" font-family="'Courier New', monospace" font-size="11" fill="#7ececa" text-anchor="middle" opacity="0.4">&#215;</text>
  <text x="600" y="208" font-family="'Courier New', monospace" font-size="11" fill="#179d97" text-anchor="middle">&#10003;</text>

  <!-- Row: Mobile app -->
  <text x="450" y="232" font-family="'Courier New', monospace" font-size="10" fill="#ffffff" opacity="0.7">Mobile app</text>
  <text x="530" y="232" font-family="'Courier New', monospace" font-size="11" fill="#7ececa" text-anchor="middle" opacity="0.4">&#215;</text>
  <text x="566" y="232" font-family="'Courier New', monospace" font-size="9" fill="#7ececa" text-anchor="middle" opacity="0.4">~</text>
  <text x="600" y="232" font-family="'Courier New', monospace" font-size="11" fill="#179d97" text-anchor="middle">&#10003;</text>

  <!-- Row: Auto-distribute -->
  <text x="450" y="256" font-family="'Courier New', monospace" font-size="10" fill="#ffffff" opacity="0.6">Evergreen</text>
  <text x="530" y="256" font-family="'Courier New', monospace" font-size="11" fill="#7ececa" text-anchor="middle" opacity="0.4">&#215;</text>
  <text x="566" y="256" font-family="'Courier New', monospace" font-size="11" fill="#7ececa" text-anchor="middle" opacity="0.4">&#215;</text>
  <text x="600" y="256" font-family="'Courier New', monospace" font-size="11" fill="#179d97" text-anchor="middle">&#10003;</text>

  <!-- Row: Accreditation (PowerDMS wins one) -->
  <text x="450" y="280" font-family="'Courier New', monospace" font-size="10" fill="#ffffff" opacity="0.5">Accredit.</text>
  <text x="530" y="280" font-family="'Courier New', monospace" font-size="11" fill="#179d97" text-anchor="middle" opacity="0.8">&#10003;</text>
  <text x="566" y="280" font-family="'Courier New', monospace" font-size="11" fill="#7ececa" text-anchor="middle" opacity="0.4">&#215;</text>
  <text x="600" y="280" font-family="'Courier New', monospace" font-size="11" fill="#7ececa" text-anchor="middle" opacity="0.4">&#215;</text>

  <!-- Bottom keyword strip -->
  <text x="68" y="348" font-family="'Courier New', monospace" font-size="10" fill="#7ececa" opacity="0.5" letter-spacing="1">AI · DISTRIBUTION · MOBILE · AUDIT TRAILS</text>

  <!-- Brand mark -->
  <text x="614" y="358" font-family="'Courier New', monospace" font-size="9" fill="#179d97" opacity="0.35" text-anchor="end" letter-spacing="2">POLICYCENTRAL.AI</text>
