<svg width="100%" viewBox="0 0 680 390" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#179d97" stroke-width="0.25" opacity="0.15"/>
    </pattern>
  </defs>

  <rect width="680" height="380" fill="#0a203a"/>
  <rect width="680" height="380" fill="url(#grid)"/>

  <!-- Corner brackets -->
  <path d="M 48 36 L 48 48 L 60 48" fill="none" stroke="#179d97" stroke-width="1.5" opacity="0.6"/>
  <path d="M 632 344 L 632 332 L 620 332" fill="none" stroke="#179d97" stroke-width="1.5" opacity="0.6"/>

  <!-- Left vertical accent -->
  <rect x="48" y="48" width="3" height="284" rx="1.5" fill="#179d97" opacity="0.5"/>

  <!-- Eyebrow -->
  <text x="68" y="100" font-family="'Courier New', monospace" font-size="11" fill="#179d97" letter-spacing="3" opacity="0.7">PLATFORM + COMPARISON</text>

  <!-- Title -->
  <text x="68" y="152" font-family="'Courier New', monospace" font-size="42" font-weight="700" fill="#ffffff" letter-spacing="-1">POLICY</text>
  <text x="68" y="200" font-family="'Courier New', monospace" font-size="42" font-weight="700" fill="#179d97" letter-spacing="-1">PLATFORMS</text>

  <!-- Tagline -->
  <text x="68" y="240" font-family="'Courier New', monospace" font-size="12" fill="#7ececa" opacity="0.7" letter-spacing="1">PowerDMS vs PolicyCentral vs ConvergePoint</text>

  <!-- Divider -->
  <line x1="68" y1="268" x2="380" y2="268" stroke="#179d97" stroke-width="0.5" opacity="0.3"/>

  <!-- HERO ELEMENT: three platform bars (PolicyCentral tallest) -->
  <g>
    <line x1="72" y1="322" x2="210" y2="322" stroke="#179d97" stroke-width="0.5" opacity="0.3"/>
    <rect x="84" y="300" width="26" height="22" rx="2" fill="#179d97" opacity="0.4"/>
    <text x="97" y="338" font-family="'Courier New', monospace" font-size="8" fill="#7ececa" text-anchor="middle" opacity="0.6">PDM</text>
    <rect x="122" y="306" width="26" height="16" rx="2" fill="#179d97" opacity="0.4"/>
    <text x="135" y="338" font-family="'Courier New', monospace" font-size="8" fill="#7ececa" text-anchor="middle" opacity="0.6">CP</text>
    <rect x="160" y="284" width="26" height="38" rx="2" fill="#179d97" opacity="0.95"/>
    <text x="173" y="338" font-family="'Courier New', monospace" font-size="8" fill="#ffffff" text-anchor="middle" opacity="0.85">PC.ai</text>
    <circle cx="173" cy="284" r="3" fill="#179d97"/>
    <circle cx="173" cy="284" r="6" fill="none" stroke="#179d97" stroke-width="0.6" opacity="0.4"/>
  </g>

  <!-- Right-side card: FEATURE MATRIX -->
  <rect x="430" y="80" width="188" height="220" rx="4" fill="none" stroke="#179d97" stroke-width="0.75" opacity="0.25"/>
  <rect x="430" y="80" width="188" height="3" rx="1.5" fill="#179d97" opacity="0.4"/>

  <!-- Card header -->
  <text x="478" y="116" font-family="'Courier New', monospace" font-size="9" fill="#179d97" text-anchor="middle" letter-spacing="2" opacity="0.6">FEATURE MATRIX</text>

  <line x1="450" y1="136" x2="598" y2="136" stroke="#179d97" stroke-width="0.4" opacity="0.2"/>

  <!-- Column headers -->
  <text x="530" y="158" font-family="'Courier New', monospace" font-size="9" fill="#7ececa" text-anchor="middle" opacity="0.7">PDM</text>
  <text x="566" y="158" font-family="'Courier New', monospace" font-size="9" fill="#7ececa" text-anchor="middle" opacity="0.7">CP</text>
  <text x="600" y="158" font-family="'Courier New', monospace" font-size="9" fill="#179d97" text-anchor="middle" opacity="0.9">PC</text>

