  <text x="566" y="184" font-family="'Courier New', monospace" font-size="11" fill="#7ececa" text-anchor="middle" opacity="0.4">&#215;</text>
  <text x="600" y="184" font-family="'Courier New', monospace" font-size="11" fill="#179d97" text-anchor="middle">&#10003;</text>

