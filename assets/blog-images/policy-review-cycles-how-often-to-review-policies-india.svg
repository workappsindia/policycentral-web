<svg width="100%" viewBox="0 0 680 390" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#179d97" stroke-width="0.25" opacity="0.15"/>
    </pattern>
  </defs>

  <rect width="680" height="380" fill="#0a203a"/>
  <rect width="680" height="380" fill="url(#grid)"/>

  <path d="M 48 36 L 48 48 L 60 48" fill="none" stroke="#179d97" stroke-width="1.5" opacity="0.6"/>
  <path d="M 632 344 L 632 332 L 620 332" fill="none" stroke="#179d97" stroke-width="1.5" opacity="0.6"/>
  <rect x="48" y="48" width="3" height="284" rx="1.5" fill="#179d97" opacity="0.5"/>

  <text x="68" y="100" font-family="'Courier New', monospace" font-size="11" fill="#179d97" letter-spacing="3" opacity="0.7">POLICY REVIEW CYCLES</text>

  <text x="68" y="152" font-family="'Courier New', monospace" font-size="42" font-weight="700" fill="#ffffff" letter-spacing="-1">REVIEW</text>
  <text x="68" y="200" font-family="'Courier New', monospace" font-size="42" font-weight="700" fill="#179d97" letter-spacing="-1">CYCLE</text>

  <text x="68" y="240" font-family="'Courier New', monospace" font-size="12" fill="#7ececa" opacity="0.7" letter-spacing="1">How often, and how to prove it</text>

  <line x1="68" y1="268" x2="360" y2="268" stroke="#179d97" stroke-width="0.5" opacity="0.3"/>

  <!-- HERO ELEMENT: cycle ring with three triggers -->
  <g transform="translate(120, 312)">
    <circle cx="0" cy="0" r="22" fill="none" stroke="#179d97" stroke-width="1" opacity="0.5" stroke-dasharray="3 3"/>
    <circle cx="0" cy="-22" r="5" fill="#179d97"/>
    <circle cx="19" cy="11" r="4" fill="#7ececa" opacity="0.75"/>
    <circle cx="-19" cy="11" r="4" fill="#7ececa" opacity="0.55"/>
    <g font-family="'Courier New', monospace" font-size="8.5" fill="#7ececa" opacity="0.7">
      <text x="42" y="-14">CALENDAR</text><text x="42" y="2">LAW CHANGE</text><text x="42" y="18">INCIDENT</text>
    </g>
  </g>

  <rect x="430" y="80" width="188" height="220" rx="4" fill="none" stroke="#179d97" stroke-width="0.75" opacity="0.25"/>
  <rect x="430" y="80" width="188" height="3" rx="1.5" fill="#179d97" opacity="0.4"/>
  <text x="524" y="116" font-family="'Courier New', monospace" font-size="9" fill="#179d97" text-anchor="middle" letter-spacing="2" opacity="0.6">THE REVIEW STEPS</text>
  <line x1="450" y1="130" x2="598" y2="130" stroke="#179d97" stroke-width="0.4" opacity="0.2"/>

  <g font-family="'Courier New', monospace" font-size="9.5" fill="#ffffff">
    <text x="450" y="152" fill="#179d97" opacity="0.8">01</text><text x="472" y="152" opacity="0.9">Name an owner</text>
    <text x="450" y="171" fill="#179d97" opacity="0.76">02</text><text x="472" y="171" opacity="0.85">Open from trigger</text>
    <text x="450" y="190" fill="#179d97" opacity="0.7">03</text><text x="472" y="190" opacity="0.78">Check practice</text>
    <text x="450" y="209" fill="#179d97" opacity="0.64">04</text><text x="472" y="209" opacity="0.72">Check the law</text>
    <text x="450" y="228" fill="#179d97" opacity="0.58">05</text><text x="472" y="228" opacity="0.66">Record outcome</text>
    <text x="450" y="247" fill="#179d97" opacity="0.52">06</text><text x="472" y="247" opacity="0.6">Approve + version</text>
    <text x="450" y="266" fill="#179d97" opacity="0.46">07</text><text x="472" y="266" opacity="0.54">Re-acknowledge</text>
  </g>

  <text x="188" y="356" font-family="'Courier New', monospace" font-size="10" fill="#7ececa" opacity="0.5" letter-spacing="1">OWN · TRIGGER · REVIEW · RECORD</text>
  <text x="614" y="358" font-family="'Courier New', monospace" font-size="9" fill="#179d97" opacity="0.35" text-anchor="end" letter-spacing="2">POLICYCENTRAL.AI</text>
</svg>
