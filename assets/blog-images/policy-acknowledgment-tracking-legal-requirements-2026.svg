<svg width="100%" viewBox="0 0 680 390" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#179d97" stroke-width="0.25" opacity="0.15"/>
    </pattern>
  </defs>

  <rect width="680" height="380" fill="#0a203a"/>
  <rect width="680" height="380" fill="url(#grid)"/>

  <!-- Corner brackets -->
  <path d="M 48 36 L 48 48 L 60 48" fill="none" stroke="#179d97" stroke-width="1.5" opacity="0.6"/>
  <path d="M 632 344 L 632 332 L 620 332" fill="none" stroke="#179d97" stroke-width="1.5" opacity="0.6"/>

  <!-- Left vertical accent -->
  <rect x="48" y="48" width="3" height="284" rx="1.5" fill="#179d97" opacity="0.5"/>

  <!-- Eyebrow -->
  <text x="68" y="100" font-family="'Courier New', monospace" font-size="11" fill="#179d97" letter-spacing="3" opacity="0.7">ACKNOWLEDGMENT + LEGAL</text>

  <!-- Title -->
  <text x="68" y="152" font-family="'Courier New', monospace" font-size="42" font-weight="700" fill="#ffffff" letter-spacing="-1">POLICY</text>
  <text x="68" y="200" font-family="'Courier New', monospace" font-size="42" font-weight="700" fill="#179d97" letter-spacing="-1">TRACKING</text>

  <!-- Tagline -->
  <text x="68" y="240" font-family="'Courier New', monospace" font-size="12" fill="#7ececa" opacity="0.7" letter-spacing="1">Legal requirements by industry, 2026</text>

  <!-- Divider -->
  <line x1="68" y1="268" x2="360" y2="268" stroke="#179d97" stroke-width="0.5" opacity="0.3"/>

  <!-- HERO ELEMENT: signature line with a verified check -->
  <g>
    <path d="M 78 308 q 8 -14 16 0 t 16 0 t 16 -2" fill="none" stroke="#7ececa" stroke-width="1.2" opacity="0.65"/>
    <line x1="78" y1="316" x2="150" y2="316" stroke="#179d97" stroke-width="0.6" opacity="0.4"/>
    <circle cx="176" cy="308" r="9" fill="none" stroke="#179d97" stroke-width="1.2" opacity="0.85"/>
    <path d="M 171 308 l 3.5 4 l 6 -8" fill="none" stroke="#179d97" stroke-width="1.4"/>
  </g>

  <!-- Bottom keyword strip -->
  <text x="68" y="348" font-family="'Courier New', monospace" font-size="10" fill="#7ececa" opacity="0.5" letter-spacing="1">TIMESTAMPED · VERSIONED · ATTRIBUTED · IMMUTABLE</text>

  <!-- Right-side card: RETENTION BY FRAMEWORK -->
  <rect x="430" y="80" width="188" height="220" rx="4" fill="none" stroke="#179d97" stroke-width="0.75" opacity="0.25"/>
  <rect x="430" y="80" width="188" height="3" rx="1.5" fill="#179d97" opacity="0.4"/>

  <!-- Card header -->
  <text x="524" y="116" font-family="'Courier New', monospace" font-size="9" fill="#179d97" text-anchor="middle" letter-spacing="2" opacity="0.6">RETENTION BY FRAMEWORK</text>

  <line x1="450" y1="136" x2="598" y2="136" stroke="#179d97" stroke-width="0.4" opacity="0.2"/>

  <!-- Framework rows: label + years -->
  <text x="450" y="162" font-family="'Courier New', monospace" font-size="10" fill="#ffffff" opacity="0.9">HIPAA</text>
  <text x="600" y="162" font-family="'Courier New', monospace" font-size="9" fill="#7ececa" text-anchor="end" opacity="0.8">6 yrs</text>

  <text x="450" y="190" font-family="'Courier New', monospace" font-size="10" fill="#ffffff" opacity="0.8">SOX</text>
  <text x="600" y="190" font-family="'Courier New', monospace" font-size="9" fill="#7ececa" text-anchor="end" opacity="0.75">7 yrs</text>

  <text x="450" y="218" font-family="'Courier New', monospace" font-size="10" fill="#ffffff" opacity="0.7">RBI / SEBI</text>
  <text x="600" y="218" font-family="'Courier New', monospace" font-size="9" fill="#7ececa" text-anchor="end" opacity="0.6">10 yrs</text>

  <text x="450" y="246" font-family="'Courier New', monospace" font-size="10" fill="#ffffff" opacity="0.6">GDPR</text>
  <text x="600" y="246" font-family="'Courier New', monospace" font-size="9" fill="#7ececa" text-anchor="end" opacity="0.55">accountability</text>

  <text x="450" y="274" font-family="'Courier New', monospace" font-size="10" fill="#ffffff" opacity="0.5">EU AI Act</text>
  <text x="600" y="274" font-family="'Courier New', monospace" font-size="9" fill="#7ececa" text-anchor="end" opacity="0.45">Aug 2026</text>

  <!-- Brand mark -->
  <text x="614" y="358" font-family="'Courier New', monospace" font-size="9" fill="#179d97" opacity="0.35" text-anchor="end" letter-spacing="2">POLICYCENTRAL.AI</text>
</svg>
