<svg width="100%" viewBox="0 0 680 390" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#179d97" stroke-width="0.25" opacity="0.15"/>
    </pattern>
  </defs>

  <rect width="680" height="380" fill="#0a203a"/>
  <rect width="680" height="380" fill="url(#grid)"/>

  <!-- Corner brackets -->
  <path d="M 48 36 L 48 48 L 60 48" fill="none" stroke="#179d97" stroke-width="1.5" opacity="0.6"/>
  <path d="M 632 344 L 632 332 L 620 332" fill="none" stroke="#179d97" stroke-width="1.5" opacity="0.6"/>

  <!-- Left vertical accent -->
  <rect x="48" y="48" width="3" height="284" rx="1.5" fill="#179d97" opacity="0.5"/>

  <!-- Eyebrow -->
  <text x="68" y="100" font-family="'Courier New', monospace" font-size="11" fill="#179d97" letter-spacing="3" opacity="0.7">AI POLICY SEARCH</text>

  <!-- Title -->
  <text x="68" y="152" font-family="'Courier New', monospace" font-size="42" font-weight="700" fill="#ffffff" letter-spacing="-1">POLICY</text>
  <text x="68" y="200" font-family="'Courier New', monospace" font-size="42" font-weight="700" fill="#179d97" letter-spacing="-1">ANSWERS</text>

  <!-- Tagline -->
  <text x="68" y="240" font-family="'Courier New', monospace" font-size="12" fill="#7ececa" opacity="0.7" letter-spacing="1">The answer, not the document</text>

  <!-- Divider -->
  <line x1="68" y1="268" x2="360" y2="268" stroke="#179d97" stroke-width="0.5" opacity="0.3"/>

  <!-- HERO ELEMENT: search magnifier with a spark (PolicyGPT motif) -->
  <g transform="translate(112, 306)">
    <circle r="24" fill="none" stroke="#179d97" stroke-width="0.5" opacity="0.2"/>
    <circle cx="-3" cy="-3" r="13" fill="none" stroke="#7ececa" stroke-width="1.4" opacity="0.7"/>
    <line x1="7" y1="7" x2="18" y2="18" stroke="#7ececa" stroke-width="1.6" opacity="0.7" stroke-linecap="round"/>
    <path d="M -3 -9 L -3 3 M -9 -3 L 3 -3" stroke="#179d97" stroke-width="1.3" opacity="0.8" stroke-linecap="round"/>
    <circle cx="-3" cy="-3" r="2" fill="#7ececa"/>
  </g>

  <!-- Bottom keyword strip -->
  <text x="68" y="348" font-family="'Courier New', monospace" font-size="10" fill="#7ececa" opacity="0.5" letter-spacing="1">SEMANTIC · SOURCE-LINKED · SCOPED TO YOU</text>

  <!-- Right-side card: POLICYGPT Q&A -->
  <rect x="430" y="80" width="188" height="220" rx="4" fill="none" stroke="#179d97" stroke-width="0.75" opacity="0.25"/>
  <rect x="430" y="80" width="188" height="3" rx="1.5" fill="#179d97" opacity="0.4"/>

  <!-- Card header -->
  <text x="524" y="116" font-family="'Courier New', monospace" font-size="9" fill="#179d97" text-anchor="middle" letter-spacing="2" opacity="0.6">POLICYGPT</text>
  <line x1="450" y1="132" x2="598" y2="132" stroke="#179d97" stroke-width="0.4" opacity="0.2"/>

  <!-- Question -->
  <text x="450" y="156" font-family="'Courier New', monospace" font-size="9" fill="#7ececa" opacity="0.55" letter-spacing="1">Q</text>
  <rect x="464" y="149" width="120" height="8" rx="4" fill="#7ececa" opacity="0.22"/>
  <text x="450" y="176" font-family="'Courier New', monospace" font-size="10" fill="#ffffff" opacity="0.85">sandwich leave?</text>

  <!-- Answer -->
  <text x="450" y="206" font-family="'Courier New', monospace" font-size="9" fill="#179d97" opacity="0.7" letter-spacing="1">A</text>
  <rect x="464" y="199" width="134" height="7" rx="3.5" fill="#179d97" opacity="0.5"/>
  <rect x="464" y="212" width="120" height="7" rx="3.5" fill="#179d97" opacity="0.35"/>
  <rect x="464" y="225" width="96" height="7" rx="3.5" fill="#179d97" opacity="0.25"/>

  <!-- Source chip -->
  <rect x="450" y="252" width="132" height="22" rx="11" fill="none" stroke="#179d97" stroke-width="0.75" opacity="0.4"/>
  <circle cx="464" cy="263" r="3" fill="#7ececa" opacity="0.8"/>
  <text x="474" y="267" font-family="'Courier New', monospace" font-size="8" fill="#7ececa" opacity="0.75" letter-spacing="1">SOURCE: LEAVE POLICY</text>

  <!-- Brand mark -->
  <text x="614" y="358" font-family="'Courier New', monospace" font-size="9" fill="#179d97" opacity="0.35" text-anchor="end" letter-spacing="2">POLICYCENTRAL.AI</text>
</svg>
