<svg width="100%" viewBox="0 0 680 390" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#179d97" stroke-width="0.25" opacity="0.15"/>
    </pattern>
  </defs>

  <rect width="680" height="380" fill="#0a203a"/>
  <rect width="680" height="380" fill="url(#grid)"/>

  <!-- Corner brackets -->
  <path d="M 48 36 L 48 48 L 60 48" fill="none" stroke="#179d97" stroke-width="1.5" opacity="0.6"/>
  <path d="M 632 344 L 632 332 L 620 332" fill="none" stroke="#179d97" stroke-width="1.5" opacity="0.6"/>

  <!-- Left vertical accent -->
  <rect x="48" y="48" width="3" height="284" rx="1.5" fill="#179d97" opacity="0.5"/>

  <!-- Eyebrow -->
  <text x="68" y="100" font-family="'Courier New', monospace" font-size="11" fill="#179d97" letter-spacing="3" opacity="0.7">BUYER'S GUIDE + INDIA + 2026</text>

  <!-- Title -->
  <text x="68" y="152" font-family="'Courier New', monospace" font-size="42" font-weight="700" fill="#ffffff" letter-spacing="-1">BEST POLICY</text>
  <text x="68" y="200" font-family="'Courier New', monospace" font-size="42" font-weight="700" fill="#179d97" letter-spacing="-1">SOFTWARE</text>

  <!-- Tagline -->
  <text x="68" y="240" font-family="'Courier New', monospace" font-size="12" fill="#7ececa" opacity="0.7" letter-spacing="1">Choosing a platform for the Indian regulatory reality</text>

  <!-- Divider -->
  <line x1="68" y1="268" x2="360" y2="268" stroke="#179d97" stroke-width="0.5" opacity="0.3"/>

  <!-- HERO ELEMENT: ascending ranking bars -->
  <g transform="translate(72, 330)">
    <rect x="0"  y="-14" width="14" height="14" rx="1.5" fill="#179d97" opacity="0.45"/>
    <rect x="22" y="-26" width="14" height="26" rx="1.5" fill="#179d97" opacity="0.6"/>
    <rect x="44" y="-40" width="14" height="40" rx="1.5" fill="#7ececa" opacity="0.75"/>
    <rect x="66" y="-56" width="14" height="56" rx="1.5" fill="#179d97" opacity="0.9"/>
    <line x1="-4" y1="2" x2="88" y2="2" stroke="#179d97" stroke-width="0.6" opacity="0.4"/>
  </g>

  <!-- Bottom keyword strip -->
  <text x="180" y="348" font-family="'Courier New', monospace" font-size="10" fill="#7ececa" opacity="0.5" letter-spacing="1">EVALUATE · SHORTLIST · DEMO · DECIDE</text>

  <!-- Right-side card -->
  <rect x="430" y="80" width="188" height="220" rx="4" fill="none" stroke="#179d97" stroke-width="0.75" opacity="0.25"/>
  <rect x="430" y="80" width="188" height="3" rx="1.5" fill="#179d97" opacity="0.4"/>

  <text x="524" y="116" font-family="'Courier New', monospace" font-size="9" fill="#179d97" text-anchor="middle" letter-spacing="2" opacity="0.6">EVALUATION CRITERIA</text>

  <line x1="450" y1="130" x2="598" y2="130" stroke="#179d97" stroke-width="0.4" opacity="0.2"/>

  <g font-family="'Courier New', monospace" font-size="9.5" fill="#ffffff">
    <text x="450" y="152" fill="#179d97" opacity="0.8">01</text><text x="472" y="152" opacity="0.9">Regulatory fit</text>
    <text x="450" y="176" fill="#179d97" opacity="0.72">02</text><text x="472" y="176" opacity="0.8">Multilingual</text>
    <text x="450" y="200" fill="#179d97" opacity="0.66">03</text><text x="472" y="200" opacity="0.72">Gen AI</text>
    <text x="450" y="224" fill="#179d97" opacity="0.6">04</text><text x="472" y="224" opacity="0.66">Distribution</text>
    <text x="450" y="248" fill="#179d97" opacity="0.55">05</text><text x="472" y="248" opacity="0.6">Audit trail</text>
    <text x="450" y="272" fill="#179d97" opacity="0.5">06</text><text x="472" y="272" opacity="0.54">Deployment</text>
  </g>

  <!-- Brand mark -->
  <text x="614" y="358" font-family="'Courier New', monospace" font-size="9" fill="#179d97" opacity="0.35" text-anchor="end" letter-spacing="2">POLICYCENTRAL.AI</text>
</svg>
