  <text x="68" y="240" font-family="'Courier New', monospace" font-size="12" fill="#7ececa" opacity="0.7" letter-spacing="1">Who accepted which version, and when</text>

  <line x1="68" y1="268" x2="360" y2="268" stroke="#179d97" stroke-width="0.5" opacity="0.3"/>

  <!-- HERO ELEMENT: chained records -->
  <g transform="translate(70, 292)" font-family="'Courier New', monospace">
    <rect x="0" y="0" width="70" height="30" rx="3" fill="none" stroke="#7ececa" stroke-width="0.8" opacity="0.5"/>
    <text x="35" y="19" font-size="9" fill="#7ececa" text-anchor="middle" opacity="0.7">a3f9...</text>
    <line x1="70" y1="15" x2="100" y2="15" stroke="#179d97" stroke-width="1" opacity="0.6"/>
    <rect x="100" y="0" width="70" height="30" rx="3" fill="none" stroke="#7ececa" stroke-width="0.8" opacity="0.65"/>
    <text x="135" y="19" font-size="9" fill="#7ececa" text-anchor="middle" opacity="0.8">7c1e...</text>
    <line x1="170" y1="15" x2="200" y2="15" stroke="#179d97" stroke-width="1" opacity="0.7"/>
    <rect x="200" y="0" width="70" height="30" rx="3" fill="#179d97" fill-opacity="0.18" stroke="#179d97" stroke-width="1.2"/>
    <text x="235" y="19" font-size="9" fill="#ffffff" text-anchor="middle">e04b...</text>
  </g>

  <rect x="430" y="80" width="188" height="220" rx="4" fill="none" stroke="#179d97" stroke-width="0.75" opacity="0.25"/>
  <rect x="430" y="80" width="188" height="3" rx="1.5" fill="#179d97" opacity="0.4"/>
  <text x="524" y="116" font-family="'Courier New', monospace" font-size="9" fill="#179d97" text-anchor="middle" letter-spacing="2" opacity="0.6">THE EVIDENCE RECORD</text>
  <line x1="450" y1="130" x2="598" y2="130" stroke="#179d97" stroke-width="0.4" opacity="0.2"/>

  <g font-family="'Courier New', monospace" font-size="9.5" fill="#ffffff">
    <text x="450" y="152" fill="#179d97" opacity="0.8">01</text><text x="472" y="152" opacity="0.9">Who (employee ID)</text>
    <text x="450" y="173" fill="#179d97" opacity="0.74">02</text><text x="472" y="173" opacity="0.82">What (version)</text>
    <text x="450" y="194" fill="#179d97" opacity="0.68">03</text><text x="472" y="194" opacity="0.75">When (timestamp)</text>
    <text x="450" y="215" fill="#179d97" opacity="0.62">04</text><text x="472" y="215" opacity="0.68">How (method)</text>
    <text x="450" y="236" fill="#179d97" opacity="0.56">05</text><text x="472" y="236" opacity="0.62">Reminders sent</text>
    <text x="450" y="257" fill="#179d97" opacity="0.5">06</text><text x="472" y="257" opacity="0.56">Hash fingerprint</text>
    <text x="450" y="278" fill="#179d97" opacity="0.44">07</text><text x="472" y="278" opacity="0.5">Retention</text>
  </g>

  <text x="188" y="356" font-family="'Courier New', monospace" font-size="10" fill="#7ececa" opacity="0.5" letter-spacing="1">ASSIGN · ACCEPT · RECORD · PROVE</text>
  <text x="614" y="358" font-family="'Courier New', monospace" font-size="9" fill="#179d97" opacity="0.35" text-anchor="end" letter-spacing="2">POLICYCENTRAL.AI</text>
