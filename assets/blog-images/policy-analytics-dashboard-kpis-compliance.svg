<svg width="100%" viewBox="0 0 680 390" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#179d97" stroke-width="0.25" opacity="0.15"/>
    </pattern>
  </defs>

  <rect width="680" height="380" fill="#0a203a"/>
  <rect width="680" height="380" fill="url(#grid)"/>

  <!-- Corner brackets -->
  <path d="M 48 36 L 48 48 L 60 48" fill="none" stroke="#179d97" stroke-width="1.5" opacity="0.6"/>
  <path d="M 632 344 L 632 332 L 620 332" fill="none" stroke="#179d97" stroke-width="1.5" opacity="0.6"/>

  <!-- Left vertical accent -->
  <rect x="48" y="48" width="3" height="284" rx="1.5" fill="#179d97" opacity="0.5"/>

  <!-- Eyebrow -->
  <text x="68" y="100" font-family="'Courier New', monospace" font-size="11" fill="#179d97" letter-spacing="3" opacity="0.7">COMPLIANCE + ANALYTICS</text>

  <!-- Title -->
  <text x="68" y="152" font-family="'Courier New', monospace" font-size="42" font-weight="700" fill="#ffffff" letter-spacing="-1">POLICY</text>
  <text x="68" y="200" font-family="'Courier New', monospace" font-size="42" font-weight="700" fill="#179d97" letter-spacing="-1">ANALYTICS</text>

  <!-- Tagline -->
  <text x="68" y="240" font-family="'Courier New', monospace" font-size="12" fill="#7ececa" opacity="0.7" letter-spacing="1">10 KPIs every compliance officer tracks</text>

  <!-- Divider -->
  <line x1="68" y1="268" x2="360" y2="268" stroke="#179d97" stroke-width="0.5" opacity="0.3"/>

  <!-- HERO ELEMENT: KPI bar chart with a rising trend -->
  <g>
    <line x1="72" y1="320" x2="200" y2="320" stroke="#179d97" stroke-width="0.5" opacity="0.3"/>
    <rect x="78" y="304" width="13" height="16" rx="1.5" fill="#179d97" opacity="0.35"/>
    <rect x="100" y="296" width="13" height="24" rx="1.5" fill="#179d97" opacity="0.5"/>
    <rect x="122" y="300" width="13" height="20" rx="1.5" fill="#179d97" opacity="0.45"/>
    <rect x="144" y="288" width="13" height="32" rx="1.5" fill="#179d97" opacity="0.7"/>
    <rect x="166" y="280" width="13" height="40" rx="1.5" fill="#179d97" opacity="0.95"/>
    <polyline points="84,300 106,294 128,297 150,286 172,278" fill="none" stroke="#7ececa" stroke-width="1" opacity="0.6"/>
    <circle cx="172" cy="278" r="3" fill="#179d97"/>
    <circle cx="172" cy="278" r="6" fill="none" stroke="#179d97" stroke-width="0.6" opacity="0.4"/>
  </g>

  <!-- Bottom keyword strip -->
  <text x="68" y="348" font-family="'Courier New', monospace" font-size="10" fill="#7ececa" opacity="0.5" letter-spacing="1">READ RATE · OVERDUE · EXPIRY · QUIZ SCORE</text>

  <!-- Right-side card: KPI DASHBOARD -->
  <rect x="430" y="80" width="188" height="220" rx="4" fill="none" stroke="#179d97" stroke-width="0.75" opacity="0.25"/>
  <rect x="430" y="80" width="188" height="3" rx="1.5" fill="#179d97" opacity="0.4"/>

  <!-- Card header -->
  <text x="478" y="116" font-family="'Courier New', monospace" font-size="9" fill="#179d97" text-anchor="middle" letter-spacing="2" opacity="0.6">KPI DASHBOARD</text>

  <!-- Coverage donut ring (top-right of card) -->
  <g transform="translate(594, 110)">
    <circle r="10" fill="none" stroke="#179d97" stroke-width="1.5" opacity="0.18"/>
    <circle r="10" fill="none" stroke="#179d97" stroke-width="1.5"
            stroke-dasharray="50 13" stroke-dashoffset="0"
            transform="rotate(-90)" opacity="0.85"/>
    <text x="0" y="3" font-family="'Courier New', monospace" font-size="7" fill="#7ececa" text-anchor="middle" opacity="0.7">10</text>
  </g>

  <line x1="450" y1="136" x2="598" y2="136" stroke="#179d97" stroke-width="0.4" opacity="0.2"/>

  <!-- Metric rows: label + mini bar + value -->
  <!-- Row 1: Read rate -->
  <text x="450" y="162" font-family="'Courier New', monospace" font-size="10" fill="#ffffff" opacity="0.9">Read rate</text>
  <rect x="450" y="168" width="120" height="3" rx="1.5" fill="#179d97" opacity="0.15"/>
  <rect x="450" y="168" width="110" height="3" rx="1.5" fill="#179d97" opacity="0.9"/>
  <text x="600" y="165" font-family="'Courier New', monospace" font-size="9" fill="#7ececa" text-anchor="end" opacity="0.8">92%</text>

  <!-- Row 2: Acknowledged -->
  <text x="450" y="190" font-family="'Courier New', monospace" font-size="10" fill="#ffffff" opacity="0.8">Acknowledged</text>
  <rect x="450" y="196" width="120" height="3" rx="1.5" fill="#179d97" opacity="0.15"/>
  <rect x="450" y="196" width="94" height="3" rx="1.5" fill="#179d97" opacity="0.8"/>
  <text x="600" y="193" font-family="'Courier New', monospace" font-size="9" fill="#7ececa" text-anchor="end" opacity="0.7">78%</text>

  <!-- Row 3: Overdue -->
  <text x="450" y="218" font-family="'Courier New', monospace" font-size="10" fill="#ffffff" opacity="0.7">Overdue</text>
  <rect x="450" y="224" width="120" height="3" rx="1.5" fill="#179d97" opacity="0.15"/>
  <rect x="450" y="224" width="22" height="3" rx="1.5" fill="#179d97" opacity="0.6"/>
  <text x="600" y="221" font-family="'Courier New', monospace" font-size="9" fill="#7ececa" text-anchor="end" opacity="0.6">14</text>

  <!-- Row 4: Quiz pass -->
  <text x="450" y="246" font-family="'Courier New', monospace" font-size="10" fill="#ffffff" opacity="0.6">Quiz pass</text>
  <rect x="450" y="252" width="120" height="3" rx="1.5" fill="#179d97" opacity="0.15"/>
  <rect x="450" y="252" width="102" height="3" rx="1.5" fill="#179d97" opacity="0.55"/>
  <text x="600" y="249" font-family="'Courier New', monospace" font-size="9" fill="#7ececa" text-anchor="end" opacity="0.55">85%</text>

  <!-- Row 5: Expiring -->
  <text x="450" y="274" font-family="'Courier New', monospace" font-size="10" fill="#ffffff" opacity="0.5">Expiring</text>
  <rect x="450" y="280" width="120" height="3" rx="1.5" fill="#179d97" opacity="0.15"/>
  <rect x="450" y="280" width="12" height="3" rx="1.5" fill="#179d97" opacity="0.4"/>
  <text x="600" y="277" font-family="'Courier New', monospace" font-size="9" fill="#7ececa" text-anchor="end" opacity="0.45">3</text>

  <!-- Brand mark -->
  <text x="614" y="358" font-family="'Courier New', monospace" font-size="9" fill="#179d97" opacity="0.35" text-anchor="end" letter-spacing="2">POLICYCENTRAL.AI</text>
</svg>
