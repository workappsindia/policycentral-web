<svg width="100%" viewBox="0 0 680 390" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#179d97" stroke-width="0.25" opacity="0.15"/>
    </pattern>
  </defs>

  <rect width="680" height="380" fill="#0a203a"/>
  <rect width="680" height="380" fill="url(#grid)"/>

  <!-- Corner brackets -->
  <path d="M 48 36 L 48 48 L 60 48" fill="none" stroke="#179d97" stroke-width="1.5" opacity="0.6"/>
  <path d="M 632 344 L 632 332 L 620 332" fill="none" stroke="#179d97" stroke-width="1.5" opacity="0.6"/>

  <!-- Left vertical accent -->
  <rect x="48" y="48" width="3" height="284" rx="1.5" fill="#179d97" opacity="0.5"/>

  <!-- Eyebrow -->
  <text x="68" y="100" font-family="'Courier New', monospace" font-size="11" fill="#179d97" letter-spacing="3" opacity="0.7">RBI DIRECTIONS + NBFC</text>

  <!-- Title -->
  <text x="68" y="152" font-family="'Courier New', monospace" font-size="42" font-weight="700" fill="#ffffff" letter-spacing="-1">NBFC BOARD</text>
  <text x="68" y="200" font-family="'Courier New', monospace" font-size="42" font-weight="700" fill="#179d97" letter-spacing="-1">POLICIES</text>

  <!-- Tagline -->
  <text x="68" y="240" font-family="'Courier New', monospace" font-size="12" fill="#7ececa" opacity="0.7" letter-spacing="1">Each policy mapped to its RBI Direction</text>

  <!-- Divider -->
  <line x1="68" y1="268" x2="360" y2="268" stroke="#179d97" stroke-width="0.5" opacity="0.3"/>

  <!-- HERO ELEMENT: scale-based regulation layers -->
  <g transform="translate(70, 294)">
    <rect x="36" y="0" width="24" height="9" rx="1.5" fill="#179d97" opacity="0.95"/>
    <rect x="24" y="12" width="48" height="9" rx="1.5" fill="#179d97" opacity="0.7"/>
    <rect x="12" y="24" width="72" height="9" rx="1.5" fill="#7ececa" opacity="0.55"/>
    <rect x="0" y="36" width="96" height="9" rx="1.5" fill="#7ececa" opacity="0.35"/>
    <g font-family="'Courier New', monospace" font-size="7" fill="#7ececa" opacity="0.55">
      <text x="104" y="7">TL</text><text x="104" y="19">UL</text><text x="104" y="31">ML</text><text x="104" y="43">BL</text>
    </g>
  </g>

  <!-- Right-side card -->
  <rect x="430" y="80" width="188" height="220" rx="4" fill="none" stroke="#179d97" stroke-width="0.75" opacity="0.25"/>
  <rect x="430" y="80" width="188" height="3" rx="1.5" fill="#179d97" opacity="0.4"/>

  <text x="524" y="116" font-family="'Courier New', monospace" font-size="9" fill="#179d97" text-anchor="middle" letter-spacing="2" opacity="0.6">THE POLICY STACK</text>

  <line x1="450" y1="130" x2="598" y2="130" stroke="#179d97" stroke-width="0.4" opacity="0.2"/>

  <g font-family="'Courier New', monospace" font-size="9.5" fill="#ffffff">
    <text x="450" y="150.0" fill="#179d97" opacity="0.8">01</text><text x="472" y="150.0" opacity="0.9">Fit &amp; proper</text>
    <text x="450" y="168.5" fill="#179d97" opacity="0.76">02</text><text x="472" y="168.5" opacity="0.84">Compliance</text>
    <text x="450" y="187.0" fill="#179d97" opacity="0.72">03</text><text x="472" y="187.0" opacity="0.79">Fair Practices</text>
    <text x="450" y="205.5" fill="#179d97" opacity="0.68">04</text><text x="472" y="205.5" opacity="0.73">KYC</text>
    <text x="450" y="224.0" fill="#179d97" opacity="0.64">05</text><text x="472" y="224.0" opacity="0.68">Outsourcing</text>
    <text x="450" y="242.5" fill="#179d97" opacity="0.6">06</text><text x="472" y="242.5" opacity="0.62">Cyber + BCP</text>
    <text x="450" y="261.0" fill="#179d97" opacity="0.56">07</text><text x="472" y="261.0" opacity="0.57">Fraud risk</text>
    <text x="450" y="279.5" fill="#179d97" opacity="0.52">08</text><text x="472" y="279.5" opacity="0.52">Stressed assets</text>
  </g>

  <!-- Bottom keyword strip -->
  <text x="188" y="356" font-family="'Courier New', monospace" font-size="10" fill="#7ececa" opacity="0.5" letter-spacing="1">APPROVE · CASCADE · REVIEW · INSPECT</text>

  <!-- Brand mark -->
  <text x="614" y="358" font-family="'Courier New', monospace" font-size="9" fill="#179d97" opacity="0.35" text-anchor="end" letter-spacing="2">POLICYCENTRAL.AI</text>
</svg>
