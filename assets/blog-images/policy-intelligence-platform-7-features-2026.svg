<svg width="100%" viewBox="0 0 680 390" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#179d97" stroke-width="0.25" opacity="0.15"/>
    </pattern>
  </defs>

  <rect width="680" height="380" fill="#0a203a"/>
  <rect width="680" height="380" fill="url(#grid)"/>

  <!-- Corner brackets -->
  <path d="M 48 36 L 48 48 L 60 48" fill="none" stroke="#179d97" stroke-width="1.5" opacity="0.6"/>
  <path d="M 632 344 L 632 332 L 620 332" fill="none" stroke="#179d97" stroke-width="1.5" opacity="0.6"/>

  <!-- Left vertical accent -->
  <rect x="48" y="48" width="3" height="284" rx="1.5" fill="#179d97" opacity="0.5"/>

  <!-- Eyebrow -->
  <text x="68" y="100" font-family="'Courier New', monospace" font-size="11" fill="#179d97" letter-spacing="3" opacity="0.7">PLATFORM + 7 FEATURES</text>

  <!-- Title -->
  <text x="68" y="152" font-family="'Courier New', monospace" font-size="42" font-weight="700" fill="#ffffff" letter-spacing="-1">POLICY</text>
  <text x="68" y="200" font-family="'Courier New', monospace" font-size="42" font-weight="700" fill="#179d97" letter-spacing="-1">PLATFORM</text>

  <!-- Tagline -->
  <text x="68" y="240" font-family="'Courier New', monospace" font-size="12" fill="#7ececa" opacity="0.7" letter-spacing="1">7 features that transform compliance, 2026</text>

  <!-- Divider -->
  <line x1="68" y1="268" x2="360" y2="268" stroke="#179d97" stroke-width="0.5" opacity="0.3"/>

  <!-- HERO ELEMENT: hub-and-spoke of 7 feature nodes -->
  <g transform="translate(140, 306)">
    <circle r="7" fill="#179d97" opacity="0.9"/>
    <g stroke="#179d97" stroke-width="0.6" opacity="0.35">
      <line x1="0" y1="0" x2="30" y2="0"/>
      <line x1="0" y1="0" x2="19" y2="-19"/>
      <line x1="0" y1="0" x2="0" y2="-24"/>
      <line x1="0" y1="0" x2="-19" y2="-19"/>
      <line x1="0" y1="0" x2="-30" y2="0"/>
      <line x1="0" y1="0" x2="-15" y2="18"/>
      <line x1="0" y1="0" x2="15" y2="18"/>
    </g>
    <circle cx="30" cy="0" r="3.5" fill="#7ececa" opacity="0.85"/>
    <circle cx="19" cy="-19" r="3.5" fill="#179d97" opacity="0.75"/>
    <circle cx="0" cy="-24" r="3.5" fill="#7ececa" opacity="0.7"/>
    <circle cx="-19" cy="-19" r="3.5" fill="#179d97" opacity="0.65"/>
    <circle cx="-30" cy="0" r="3.5" fill="#7ececa" opacity="0.6"/>
    <circle cx="-15" cy="18" r="3.5" fill="#179d97" opacity="0.55"/>
    <circle cx="15" cy="18" r="3.5" fill="#7ececa" opacity="0.5"/>
  </g>

  <!-- Bottom keyword strip -->
  <text x="68" y="348" font-family="'Courier New', monospace" font-size="10" fill="#7ececa" opacity="0.5" letter-spacing="1">AUTHOR · DISTRIBUTE · TRACK · SECURE</text>

  <!-- Right-side card: 7 FEATURES -->
  <rect x="430" y="80" width="188" height="220" rx="4" fill="none" stroke="#179d97" stroke-width="0.75" opacity="0.25"/>
  <rect x="430" y="80" width="188" height="3" rx="1.5" fill="#179d97" opacity="0.4"/>

  <!-- Card header -->
  <text x="524" y="116" font-family="'Courier New', monospace" font-size="9" fill="#179d97" text-anchor="middle" letter-spacing="2" opacity="0.6">THE 7 FEATURES</text>

  <line x1="450" y1="130" x2="598" y2="130" stroke="#179d97" stroke-width="0.4" opacity="0.2"/>

  <!-- Feature rows: index + label -->
  <g font-family="'Courier New', monospace" font-size="9.5" fill="#ffffff">
    <text x="450" y="150" fill="#179d97" opacity="0.8">01</text><text x="472" y="150" opacity="0.9">AI authoring</text>
    <text x="450" y="171" fill="#179d97" opacity="0.75">02</text><text x="472" y="171" opacity="0.82">Conversational AI</text>
    <text x="450" y="192" fill="#179d97" opacity="0.7">03</text><text x="472" y="192" opacity="0.76">Precision distribution</text>
    <text x="450" y="213" fill="#179d97" opacity="0.65">04</text><text x="472" y="213" opacity="0.7">Real-time tracking</text>
    <text x="450" y="234" fill="#179d97" opacity="0.6">05</text><text x="472" y="234" opacity="0.64">Engagement tools</text>
    <text x="450" y="255" fill="#179d97" opacity="0.55">06</text><text x="472" y="255" opacity="0.58">Enterprise infra</text>
    <text x="450" y="276" fill="#179d97" opacity="0.5">07</text><text x="472" y="276" opacity="0.52">Security + audit</text>
  </g>

  <!-- Brand mark -->
  <text x="614" y="358" font-family="'Courier New', monospace" font-size="9" fill="#179d97" opacity="0.35" text-anchor="end" letter-spacing="2">POLICYCENTRAL.AI</text>
</svg>
