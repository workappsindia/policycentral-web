<svg width="100%" viewBox="0 0 680 390" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#179d97" stroke-width="0.25" opacity="0.15"/>
    </pattern>
  </defs>

  <rect width="680" height="380" fill="#0a203a"/>
  <rect width="680" height="380" fill="url(#grid)"/>

  <!-- Corner brackets -->
  <path d="M 48 36 L 48 48 L 60 48" fill="none" stroke="#179d97" stroke-width="1.5" opacity="0.6"/>
  <path d="M 632 344 L 632 332 L 620 332" fill="none" stroke="#179d97" stroke-width="1.5" opacity="0.6"/>

  <!-- Left vertical accent -->
  <rect x="48" y="48" width="3" height="284" rx="1.5" fill="#179d97" opacity="0.5"/>

  <!-- Eyebrow -->
  <text x="68" y="100" font-family="'Courier New', monospace" font-size="11" fill="#179d97" letter-spacing="3" opacity="0.7">ENTERPRISE + AUTOMATION</text>

  <!-- Title -->
  <text x="68" y="152" font-family="'Courier New', monospace" font-size="42" font-weight="700" fill="#ffffff" letter-spacing="-1">POLICY</text>
  <text x="68" y="200" font-family="'Courier New', monospace" font-size="42" font-weight="700" fill="#179d97" letter-spacing="-1">WORKFLOW</text>

  <!-- Tagline -->
  <text x="68" y="240" font-family="'Courier New', monospace" font-size="12" fill="#7ececa" opacity="0.7" letter-spacing="1">A complete implementation guide, 2026</text>

  <!-- Divider -->
  <line x1="68" y1="268" x2="360" y2="268" stroke="#179d97" stroke-width="0.5" opacity="0.3"/>

  <!-- HERO ELEMENT: connected workflow nodes -->
  <g transform="translate(74, 308)">
    <line x1="14" y1="0" x2="52" y2="0" stroke="#179d97" stroke-width="0.8" opacity="0.4"/>
    <line x1="66" y1="0" x2="104" y2="0" stroke="#179d97" stroke-width="0.8" opacity="0.4"/>
    <line x1="118" y1="0" x2="156" y2="0" stroke="#179d97" stroke-width="0.8" opacity="0.4"/>
    <rect x="2" y="-7" width="14" height="14" rx="2" fill="#179d97" opacity="0.35"/>
    <rect x="54" y="-7" width="14" height="14" rx="2" fill="#179d97" opacity="0.55"/>
    <rect x="106" y="-7" width="14" height="14" rx="2" fill="#179d97" opacity="0.75"/>
    <circle cx="165" cy="0" r="9" fill="none" stroke="#179d97" stroke-width="1.2" opacity="0.9"/>
    <path d="M 160 0 l 3.5 4 l 6 -8" fill="none" stroke="#179d97" stroke-width="1.4"/>
  </g>

  <!-- Bottom keyword strip -->
  <text x="68" y="348" font-family="'Courier New', monospace" font-size="10" fill="#7ececa" opacity="0.5" letter-spacing="1">DRAFT · APPROVE · DISTRIBUTE · ACKNOWLEDGE · REVIEW</text>

  <!-- Right-side card: 7-STAGE LIFECYCLE -->
  <rect x="430" y="80" width="188" height="220" rx="4" fill="none" stroke="#179d97" stroke-width="0.75" opacity="0.25"/>
  <rect x="430" y="80" width="188" height="3" rx="1.5" fill="#179d97" opacity="0.4"/>

  <!-- Card header -->
  <text x="524" y="116" font-family="'Courier New', monospace" font-size="9" fill="#179d97" text-anchor="middle" letter-spacing="2" opacity="0.6">7-STAGE LIFECYCLE</text>

  <line x1="450" y1="132" x2="598" y2="132" stroke="#179d97" stroke-width="0.4" opacity="0.2"/>

  <!-- Stage rows: number node + label -->
  <g font-family="'Courier New', monospace" font-size="9.5" fill="#ffffff">
    <circle cx="456" cy="152" r="7" fill="#179d97" opacity="0.85"/>
    <text x="456" y="155" font-size="8" fill="#0a203a" text-anchor="middle">1</text>
    <text x="470" y="155" opacity="0.9">Initiation</text>

    <circle cx="456" cy="174" r="7" fill="#179d97" opacity="0.75"/>
    <text x="456" y="177" font-size="8" fill="#0a203a" text-anchor="middle">2</text>
    <text x="470" y="177" opacity="0.82">Drafting</text>

    <circle cx="456" cy="196" r="7" fill="#179d97" opacity="0.68"/>
    <text x="456" y="199" font-size="8" fill="#0a203a" text-anchor="middle">3</text>
    <text x="470" y="199" opacity="0.76">Review + approval</text>

    <circle cx="456" cy="218" r="7" fill="#179d97" opacity="0.6"/>
    <text x="456" y="221" font-size="8" fill="#0a203a" text-anchor="middle">4</text>
    <text x="470" y="221" opacity="0.7">Publication</text>

    <circle cx="456" cy="240" r="7" fill="#179d97" opacity="0.52"/>
    <text x="456" y="243" font-size="8" fill="#0a203a" text-anchor="middle">5</text>
    <text x="470" y="243" opacity="0.64">Distribution</text>

    <circle cx="456" cy="262" r="7" fill="#179d97" opacity="0.44"/>
    <text x="456" y="265" font-size="8" fill="#0a203a" text-anchor="middle">6</text>
    <text x="470" y="265" opacity="0.58">Acknowledgment</text>

    <circle cx="456" cy="284" r="7" fill="#179d97" opacity="0.36"/>
    <text x="456" y="287" font-size="8" fill="#0a203a" text-anchor="middle">7</text>
    <text x="470" y="287" opacity="0.52">Review + retire</text>
  </g>

  <!-- Brand mark -->
  <text x="614" y="358" font-family="'Courier New', monospace" font-size="9" fill="#179d97" opacity="0.35" text-anchor="end" letter-spacing="2">POLICYCENTRAL.AI</text>
</svg>
