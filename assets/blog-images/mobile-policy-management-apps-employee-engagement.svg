  <path d="M 578 152 l 1.6 2 l 3 -3.5" fill="none" stroke="#179d97" stroke-width="1"/>

  <rect x="502" y="176" width="86" height="26" rx="4" fill="#179d97" opacity="0.08"/>
  <rect x="508" y="182" width="34" height="3" rx="1.5" fill="#ffffff" opacity="0.45"/>
  <rect x="508" y="190" width="56" height="2.5" rx="1.25" fill="#7ececa" opacity="0.25"/>

  <rect x="502" y="208" width="86" height="26" rx="4" fill="#179d97" opacity="0.06"/>
  <rect x="508" y="214" width="44" height="3" rx="1.5" fill="#ffffff" opacity="0.35"/>
  <rect x="508" y="222" width="50" height="2.5" rx="1.25" fill="#7ececa" opacity="0.2"/>

