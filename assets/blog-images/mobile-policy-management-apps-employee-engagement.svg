  <rect x="502" y="120" width="86" height="14" rx="7" fill="none" stroke="#179d97" stroke-width="0.6" opacity="0.3"/>
  <circle cx="512" cy="127" r="3" fill="none" stroke="#7ececa" stroke-width="0.6" opacity="0.5"/>
  <text x="522" y="130" font-family="'Courier New', monospace" font-size="6.5" fill="#7ececa" opacity="0.5">casual leave</text>

